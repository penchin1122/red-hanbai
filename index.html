<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ReD 販売記録</title>
<meta name="description" content="ReD販売員用の販売記録・欠品チェック・日報作成アプリ">
<meta name="theme-color" content="#c8161d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ReD記録">
<script>try{var t=(JSON.parse(localStorage.getItem("red-hanbai-v1")||"{}").settings||{}).theme||"light";if(t!=="auto")document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<style>
/* 片手操作のスマホ用ツール。上に日付バー、中央に1画面分の作業、下に固定タブ。赤＝操作と注意、墨色＝選択状態。 */
:root{
  --bg:#f7f4f4; --surface:#ffffff; --surface-2:#f1eded; --fg:#1d1b1c; --muted:#6b6467; --line:#e3dcdc;
  --accent:#c8161d; --accent-fg:#ffffff; --accent-soft:#fdeceb; --accent-deep:#9e1015;
  --ink:#26232a; --ink-fg:#ffffff;
  --ok:#1b7a45; --ok-soft:#e4f3ea; --warn:#9a5c00; --warn-soft:#fdf1dc;
  --shadow:0 1px 2px rgba(60,20,20,.06),0 4px 14px rgba(60,20,20,.06);
  --font:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141213; --surface:#1e1a1b; --surface-2:#282324; --fg:#efeaea; --muted:#aba2a4; --line:#3a3334;
  --accent:#ff5a55; --accent-fg:#2a0607; --accent-soft:#3b1716; --accent-deep:#ff8a85;
  --ink:#ece7e8; --ink-fg:#18151a;
  --ok:#62cc8f; --ok-soft:#163324; --warn:#f2b456; --warn-soft:#3a2b12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141213; --surface:#1e1a1b; --surface-2:#282324; --fg:#efeaea; --muted:#aba2a4; --line:#3a3334;
  --accent:#ff5a55; --accent-fg:#2a0607; --accent-soft:#3b1716; --accent-deep:#ff8a85;
  --ink:#ece7e8; --ink-fg:#18151a;
  --ok:#62cc8f; --ok-soft:#163324; --warn:#f2b456; --warn-soft:#3a2b12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent);transform-origin:left;animation:grow .9s var(--ease) both}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap}
.mark{font-weight:900;font-size:22px;letter-spacing:-.02em;color:var(--accent);line-height:1}
.brand span:last-child{display:flex;flex-direction:column;line-height:1.25}
.brand b{font-size:13px}
.brand small{font-size:11px;color:var(--muted)}
.datebox{margin-left:auto;display:flex;align-items:center;gap:6px}
.datebox input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;font-size:14px;min-width:0;width:140px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;white-space:nowrap;transition:background .2s,border-color .2s,transform .12s}
.iconbtn:active{transform:scale(.95)}
.iconbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ink-fg)}

main{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
main .wrap{display:flex;flex-direction:column;gap:14px;padding-block:14px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{position:relative;display:grid;grid-template-columns:repeat(4,1fr);padding-block:6px}
nav.tabs .pill{position:absolute;top:6px;bottom:6px;left:max(16px,env(safe-area-inset-left,0px));width:calc((100% - max(16px,env(safe-area-inset-left,0px)) - max(16px,env(safe-area-inset-right,0px)))/4);background:var(--accent-soft);border-radius:10px;transition:transform .45s var(--spring),opacity .2s}
nav.tabs button{position:relative;border:0;background:none;border-radius:10px;padding:9px 0;font-size:13px;color:var(--muted);font-weight:500;transition:color .25s}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}

h2{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em;margin:0}
.sec{display:flex;flex-direction:column;gap:8px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:12px}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:1px;letter-spacing:.04em}
.badge.req{background:var(--accent);color:var(--accent-fg)}
.badge.opt{background:var(--surface-2);color:var(--muted)}

/* 入場アニメーション：タブ・日付を切り替えたときだけ */
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,0) scale(.7)}20%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-46px) scale(1)}}
@keyframes ripple{from{transform:translate(-50%,-50%) scale(0);opacity:.35}to{transform:translate(-50%,-50%) scale(1);opacity:0}}
@keyframes flash{0%,30%{background:var(--accent-soft);border-color:var(--accent)}100%{background:var(--surface)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px) scale(.96)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.enter>*{animation:rise .45s var(--ease) both;animation-delay:calc(var(--i,0)*55ms)}

.banner{border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.banner.info{background:var(--surface);border:1px solid var(--line)}
.banner.warn{background:var(--warn-soft)}
.banner.alert{background:var(--accent-soft)}
.banner.closed{background:var(--ink);color:var(--ink-fg);flex-direction:row;align-items:center;justify-content:space-between}
.banner.closed .btn{background:transparent;color:var(--ink-fg);border-color:color-mix(in srgb,var(--ink-fg) 40%,transparent)}
.banner ul{margin:0;padding-left:1.2em}

.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;border-left:1px solid var(--line);background:none;padding:10px 4px;font-size:14px;transition:background .22s var(--ease),color .22s}
.seg button:first-child{border-left:0}
.seg button:active{background:var(--surface-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg);font-weight:700}

.ctr-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctr{position:relative;display:flex;flex-direction:column}
.ctr .tap{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:122px;touch-action:manipulation;box-shadow:var(--shadow);transition:transform .15s var(--ease),border-color .2s}
.ctr .tap:active{transform:scale(.97);border-color:var(--accent)}
.ctr .lbl{font-weight:700;font-size:15px}
.ctr .num{font-size:40px;font-weight:900;line-height:1.1;margin-top:auto;color:var(--accent);display:inline-block;transform-origin:left bottom}
.ctr .num.bump{animation:bump .38s var(--spring)}
.ctr .note{font-size:11px;color:var(--muted);line-height:1.4;padding-right:30px}
.ctr .minus{position:absolute;top:8px;right:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:6px;font-size:12px;padding:2px 8px;color:var(--muted);transition:transform .12s}
.ctr .minus:active{transform:scale(.9)}
.ripple{position:absolute;width:260px;height:260px;border-radius:50%;background:var(--accent);pointer-events:none;animation:ripple .6s ease-out forwards}
.floater{position:absolute;left:50%;top:40%;font-weight:900;font-size:18px;color:var(--accent);pointer-events:none;animation:floatUp .75s var(--ease) forwards;z-index:2}
.locked .tap,.locked .stepper button,.actions.locked .btn{opacity:.4;pointer-events:none}

.mini-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.stepper{position:relative;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-width:0;box-shadow:var(--shadow)}
.stepper .lbl{font-size:12px;font-weight:700;line-height:1.4}
.stepper .ctl{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.stepper .ctl b{font-size:22px;min-width:1.8em;text-align:center;display:inline-block}
.stepper .ctl b.bump{animation:bump .38s var(--spring)}
.stepper .ctl button{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:4px 6px;font-size:12px;min-width:32px;white-space:nowrap;transition:transform .12s}
.stepper .ctl button:active{transform:scale(.9)}

.actions{display:grid;grid-template-columns:3fr 2fr;gap:10px}
.btn{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;font-weight:700;font-size:15px;transition:transform .15s var(--ease),background .2s,box-shadow .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 28%,transparent)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--ink-fg)}
.btn.big{padding:18px 12px;font-size:16px}
.btn.outline-accent{color:var(--accent);border-color:var(--accent);background:var(--surface)}
.btn:disabled{background:var(--surface-2);color:var(--muted);border-color:var(--line);cursor:not-allowed;box-shadow:none}
.btn.sm{padding:7px 12px;font-size:13px;font-weight:500}
.btn.block{width:100%}
.linkbtn{border:0;background:none;color:var(--accent);font-size:12px;padding:0;text-decoration:underline;text-underline-offset:2px}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 8px;display:flex;flex-direction:column;gap:2px;min-width:0;box-shadow:var(--shadow)}
.kpi span{font-size:11px;color:var(--muted)}
.kpi b{font-size:20px;line-height:1.2;overflow-wrap:anywhere}
.kpi i{font-style:normal;font-size:11px;color:var(--muted);line-height:1.35}

.log{display:flex;flex-direction:column;gap:6px}
.log button{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;transition:transform .15s var(--ease)}
.log button:active{transform:scale(.98)}
.log button.flash{animation:flash 1.6s var(--ease)}
.log .t{font-size:12px;color:var(--muted);padding-top:2px}
.log .body{min-width:0;display:flex;flex-direction:column;gap:4px}
.log .ttl{font-weight:500;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.acc{background:var(--accent);color:var(--accent-fg)}
.tag.ink{background:var(--ink);color:var(--ink-fg)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:16px;text-align:center;color:var(--muted);font-size:13px}

/* 欠品 */
.grp{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.grp h3{margin:0;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;padding:8px 12px;background:var(--surface-2)}
.srow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line);transition:background .3s}
.srow:first-of-type{border-top:0}
.srow.is-out{background:var(--accent-soft)}
.srow.is-low{background:var(--warn-soft)}
.srow .nm{min-width:0;overflow-wrap:anywhere;font-size:14px}
.srow .nm small{color:var(--muted);margin-left:4px}
.srow.sub .nm{padding-left:14px;font-size:13px}
.tri{display:grid;grid-template-columns:repeat(3,auto);border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.tri button{border:0;border-left:1px solid var(--line);background:none;font-size:12px;padding:6px 11px;transition:background .25s var(--ease),color .25s}
.tri button:first-child{border-left:0}
.tri button[aria-pressed="true"][data-v="ok"]{background:var(--ok);color:#fff;font-weight:700}
.tri button[aria-pressed="true"][data-v="low"]{background:var(--warn);color:#fff;font-weight:700}
.tri button[aria-pressed="true"][data-v="out"]{background:var(--accent);color:var(--accent-fg);font-weight:700}

.scard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.scard-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.scard-head b{font-size:14px}
.mxwrap{overflow-x:auto}
.mx{border-collapse:separate;border-spacing:4px;width:auto;font-size:12px}
.mx th,.mx td{border:0;padding:0;text-align:center;white-space:nowrap}
.mx thead th{background:none;font-size:11px;color:var(--muted);font-weight:700;padding-bottom:2px}
.mx tbody th{text-align:left;font-weight:500;color:var(--fg);padding-right:6px;font-size:12px}
.cell{display:inline-grid;place-items:center;width:44px;height:36px;border-radius:8px;border:1px solid var(--line);font-size:15px;font-weight:700;transition:background .25s var(--ease),color .25s,transform .15s var(--spring)}
.cell:active{transform:scale(.88)}
.legend .cell{width:22px;height:20px;font-size:11px;border-radius:5px;margin:0 2px;vertical-align:-4px}
.cell.st-ok{background:var(--surface);color:var(--ok)}
.cell.st-low{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.cell.st-out{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.cell.pop{animation:pop .3s var(--spring)}
.outpick{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;animation:rise .3s var(--ease)}
/* 日報 */
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;font-weight:700}
.field .hint{font-size:11px;color:var(--muted)}
.field input,.field textarea,.field select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;width:100%;min-width:0;transition:border-color .2s,box-shadow .2s}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{min-height:64px;resize:vertical;line-height:1.5}
.field.missing input{border-color:var(--accent);animation:shake .35s}
.field-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.out{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12.5px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;max-height:300px;overflow:auto;margin:0;font-family:var(--font);user-select:text;-webkit-user-select:text}
.out-card{display:flex;flex-direction:column;gap:8px}
.out-card .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.out-card .head b{font-size:15px}
details.opt-fields{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details.opt-fields summary{padding:12px 14px;font-weight:700;font-size:14px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.opt-fields summary::after{content:"＋";color:var(--muted);transition:transform .3s var(--ease)}
details.opt-fields[open] summary::after{transform:rotate(45deg)}
details.opt-fields .inner{display:flex;flex-direction:column;gap:12px;padding:0 14px 14px}
details.opt-fields[open] .inner{animation:rise .35s var(--ease)}

/* 分析 */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;transition:transform .12s,background .2s,color .2s}
.chip:active{transform:scale(.94)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg);border-color:var(--ink);font-weight:700}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:minmax(0,9.5em) 1fr 3.2em;align-items:center;gap:8px;font-size:13px}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bar .fill{display:block;height:100%;background:var(--accent);border-radius:5px;transform-origin:left;animation:grow .8s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
.bar .fill.ink{background:var(--ink)}
.bar .v{text-align:right;font-weight:700}
.funnel{display:flex;flex-direction:column;gap:8px}
.fstep{display:grid;grid-template-columns:5em 1fr 3.5em;gap:8px;align-items:center;font-size:13px}
.fstep .track{height:24px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.fstep .fill{display:block;height:100%;background:var(--accent);border-radius:6px;transform-origin:left;animation:grow .9s var(--ease) both;animation-delay:calc(var(--i,0)*120ms)}
.fstep .v{text-align:right;font-weight:700}
.rate{font-size:12px;color:var(--muted);padding-left:5.5em}
.rate b{color:var(--fg)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{border-top:0;font-size:11px;color:var(--muted);font-weight:700;background:var(--surface-2)}
.heat td{text-align:center;transition:background .4s}
.heat td.h{font-weight:700}

/* 設定 */
.prow{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.prow .nm{font-size:14px;min-width:0;overflow-wrap:anywhere}
.prow .nm small{display:block;color:var(--muted);font-size:11px}

];
const PMAP=Object.fromEntries(PRODUCTS.map(p=>[p.n,p]));
/* 店舗の初期設定（ハンズ町田）：サイズ・色・取り扱い。設定画面で上書きできる */
const DEF={};const setD=(ns,o)=>ns.forEach(n=>DEF[n]=o);
setD([10,11,14,15,17,19],{s:['S','M','L','LL'],c:['ホワイト','ブラック','ベージュ'],on:true});

setD([25,26,27,28,29,30,31,32],{s:['S','M','L'],c:[],on:false});
DEF[33]={s:['23-25','25-27'],c:['レッド','ホワイト','ネイビー','グレー','ブラック'],on:true,price:'1980'};
setD([34,35,36],{s:[],c:[],on:false});

 {k:'voice',label:'声かけ',note:'声をかけた人数（接客に繋がらなくても）'},
 {k:'serve',label:'接客',note:'会話が3往復以上'},

 {k:'sample',label:'サンプル体験',note:'お客様が自分で手に取った'},
];
const TABS=['rec','stock','report','stats'];
/* 日報フォームの選択肢（3. 屋号 / 4. 入店舗名）と同じ表記 */
const BRANDS=['ビックカメラ','ヨドバシカメラ','エディオン','ハンズ','ロフト','ゼビオ','アピタ','ゆめタウン'];
const STORES=['ビックカメラ有楽町','ビックカメラ池袋本','ビックカメラ新宿西口','ビックカメラ川崎','ビックカメラ柏','ビックカメラ大宮西','ビックカメラ立川','ビックカメラ札幌東急','ビックカメラ名古屋JR ゲートタワー','ビックカメラなんば','ビックカメラ新宿東口旧ビックロ','ビックカメラ千葉駅前','ビックカメラ藤沢','ビックカメラ池袋西口ITtower','ヨドバシカメラAkiba','ヨドバシカメラ横浜','ヨドバシカメラ新宿西口','ヨドバシカメラ京都','エディオンなんば','ハンズ博多','ハンズ新宿','ロフト渋谷','ロフト吉祥寺','ロフト千葉','ロフト銀座','ハンズ北千住','ハンズ横浜','ハンズ町田','ハンズ東京','西宮ロフト','横浜ロフト','ゼビオ札幌月寒','アピタ浜北','ゆめタウン久留米','ゆめタウン高松','池袋ロフト'];

/* ===== ユーティリティ ===== */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];

const md=iso=>{const [,m,d]=iso.split('-').map(Number);return `${m}/${d}（${wd(iso)}）`};

const ageLabel=a=>a==='60'?'60代以上':a+'代';

/* ===== 保存 ===== */
let storageOK=true;
function blank(){return {v:1,sample:false,settings:{reporter:'',brand:'ハンズ',store:'ハンズ町田',theme:'light',prod:{}},days:{},stock:{},stockChecked:''}}

function prodCfg(n){const c=S.settings.prod[n]||{},d=DEF[n]||{s:[],c:[],on:true};return {active:c.active??d.on,price:c.price??(d.price||''),sizes:c.sizes??d.s,colors:c.colors??d.c}}
const dims=n=>{const c=prodCfg(n);return {sz:c.sizes.length?c.sizes:[''],cl:c.colors.length?c.colors:[''],has:c.sizes.length||c.colors.length}};

function stats(d){
 const qty={};let items=0,revenue=0,unpriced=0;const ag={};let repeat=0,gift=0,sw=0,unknown=0;
 d.sales.forEach(s=>{
  s.items.forEach(it=>{qty[it.p]=(qty[it.p]||0)+it.q;items+=it.q;const pr=Number(prodCfg(it.p).price);if(pr)revenue+=pr*it.q;else unpriced+=it.q});

  if(s.repeat)repeat++;if(s.gift)gift++;if(s.sw)sw++;

 const notes=list.map(l=>l.note).filter(Boolean);if(notes.length)t+=`。${notes.join('／')}`;

}

 switch(n){

 }

}

function countUp(el){
 const to=parseFloat(el.dataset.count),suf=el.dataset.suf||'',dec=+(el.dataset.dec||0);
 if(reduced()||!to){el.textContent=(dec?to.toFixed(dec):to.toLocaleString('ja-JP'))+suf;return}
 const t0=performance.now(),dur=700;
 const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3),v=to*e;el.textContent=(dec?v.toFixed(dec):Math.round(v).toLocaleString('ja-JP'))+suf;if(k<1)requestAnimationFrame(step)};
 requestAnimationFrame(step);
}

  Object.entries(st.qty).forEach(([p,q])=>qty[p]=(qty[p]||0)+q);Object.entries(st.ag).forEach(([g,c])=>ag[g]=(ag[g]||0)+c);
  d.lost.forEach(l=>(l.reasons.length?l.reasons:['その他']).forEach(r=>lost[r]=(lost[r]||0)+1));
  d.sales.forEach(s=>{const h=parseInt(s.t);hour[h]=(hour[h]||0)+1});
  if(d.crowd){(crowd[d.crowd]=crowd[d.crowd]||{n:0,b:0}).n++;crowd[d.crowd].b+=st.buyers}
  return {k,d,st};});
 const n=keys.length;
 const bars=(entries,max,cls='')=>entries.length?`<div class="bars">${entries.map(([l,v])=>`<div class="bar"><span class="nm" title="${esc(l)}">${esc(l)}</span><span class="track"><span class="fill ${cls}" style="width:${max?v/max*100:0}%"></span></span><span class="v">${v}</span></div>`).join('')}</div>`:'<div class="empty">記録なし</div>';
 const pq=Object.entries(qty).map(([p,q])=>[PMAP[p].name,q]).sort((a,b)=>b[1]-a[1]);
 const lq=Object.entries(lost).sort((a,b)=>b[1]-a[1]);
 const hrs=[];for(let h=10;h<=19;h++)hrs.push([`${h}時台`,hour[h]||0]);
 const maxAg=Math.max(1,...Object.values(ag));
 const heat=`<div class="tblwrap"><table class="heat"><thead><tr><th></th>${AGES.map(a=>`<th>${ageLabel(a)}</th>`).join('')}</tr></thead><tbody>${['m','f'].map(g=>`<tr><td>${genderLabel(g)}</td>${AGES.map(a=>{const v=ag[g+a]||0;return `<td class="${v?'h':''}" style="background:color-mix(in srgb, var(--accent) ${Math.round(v/maxAg*40)}%, transparent)">${v}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`;
 const fmax=Math.max(1,T.voice);
 const fstep=(l,v)=>`<div class="fstep"><span>${l}</span><span class="track"><span class="fill" style="width:${v/fmax*100}%"></span></span><span class="v">${v}</span></div>`;
 const cr=CROWD.filter(c=>crowd[c]);
 return `
 <div class="chips">${chips}</div>
 <div class="kpis">
  <div class="kpi"><span>勤務日数</span><b data-count="${n}" data-suf="日">${n}日</b><i>${md(keys[0])}〜</i></div>
  <div class="kpi"><span>購入人数</span><b data-count="${T.buyers}" data-suf="名">${T.buyers}名</b><i>1日平均 ${(T.buyers/n).toFixed(1)}名</i></div>
  <div class="kpi"><span>販売点数</span><b data-count="${T.items}" data-suf="点">${T.items}点</b><i>1人 ${T.buyers?(T.items/T.buyers).toFixed(1):'—'}点</i></div>
  <div class="kpi"><span>売上</span>${T.revenue?`<b data-count="${T.revenue}" data-suf="円">${yen(T.revenue)}</b>`:'<b>—</b>'}<i>${T.revenue?(T.unpriced?'単価未設定を除く':'単価×点数'):'設定で単価を入力'}</i></div>
 </div>
 <div class="sec"><h2>接客の流れ</h2><div class="card funnel">
  ${fstep('声かけ',T.voice)}<div class="rate">接客率 <b>${pct(T.serve,T.voice)}</b></div>
  ${fstep('接客',T.serve)}<div class="rate">購入率 <b>${pct(T.buyers,T.serve)}</b></div>
  ${fstep('購入',T.buyers)}
  <div class="small muted">デモ体験 ${T.demo}（接客の${pct(T.demo,T.serve)}）／サンプル体験 ${T.sample}／誘導 ${T.guide}<br>リピート ${T.repeat}名・ギフト ${T.gift}名・他社から切り返し ${T.sw}名</div>
 </div></div>
 <div class="sec"><h2>売れた商品</h2><div class="card">${bars(pq,pq[0]?.[1])}</div></div>
 <div class="sec"><h2>購入者の年代・性別</h2>${heat}</div>
 <div class="sec"><h2>購入に至らなかった理由</h2><div class="card">${bars(lq,lq[0]?.[1],'ink')}</div></div>
 <div class="sec"><h2>時間帯別の購入人数</h2><div class="card">${bars(hrs,Math.max(1,...hrs.map(x=>x[1])))}</div></div>
 ${cr.length?`<div class="sec"><h2>集客状況別の購入人数（1日平均）</h2><div class="card">${bars(cr.map(c=>[`${c}（${crowd[c].n}日）`,+(crowd[c].b/crowd[c].n).toFixed(1)]),Math.max(...cr.map(c=>crowd[c].b/crowd[c].n)))}</div></div>`:''}
 <div class="sec"><h2>日別</h2><div class="tblwrap"><table><thead><tr><th>日付</th><th>集客</th><th>声かけ</th><th>接客</th><th>購入</th><th>点数</th><th>購入率</th></tr></thead><tbody>
  ${perDay.slice().reverse().map(({k,d,st})=>`<tr><td><button class="linkbtn" data-act="goDay" data-k="${k}">${md(k)}</button></td><td>${d.crowd||'—'}</td><td>${d.c.voice}</td><td>${d.c.serve}</td><td>${st.buyers}</td><td>${st.items}</td><td>${pct(st.buyers,d.c.serve)}</td></tr>`).join('')}
 </tbody></table></div></div>`;
}

 data.items.forEach(it=>it.out=false);
 openSheet({type:'sale',id,pick:null,data});

function closeSheet(){
 const el=$('#sheet');if(el.hidden)return;
 ui.sheet=null;ui.confirm=null;ui.missing=null;el.classList.remove('show');document.body.style.overflow='';
 setTimeout(()=>{if(!ui.sheet){el.hidden=true;el.innerHTML=''}},reduced()?0:320);

 const el=$('#sheet'),sh=ui.sheet;if(!sh)return closeSheet();

/* ===== 演出 ===== */
let toastT;
function toast(m){const t=$('#toast');t.hidden=true;void t.offsetWidth;t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200)}
function buzz(ms=10){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
function ripple(btn,e){if(reduced())return;const r=btn.getBoundingClientRect(),s=document.createElement('span');s.className='ripple';s.style.left=((e.clientX||r.left+r.width/2)-r.left)+'px';s.style.top=((e.clientY||r.top+r.height/2)-r.top)+'px';btn.appendChild(s);setTimeout(()=>s.remove(),650)}
function floater(host,text){if(reduced())return;const f=document.createElement('span');f.className='floater';f.textContent=text;host.appendChild(f);setTimeout(()=>f.remove(),800)}
function bumpCounter(k,text){
 const d=getDay();
 $$(`[data-num="${k}"]`).forEach(el=>{el.textContent=d.c[k];el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')});
 const host=$(`[data-num="${k}"]`)?.closest('.tap,.stepper');if(host&&text)floater(host,text);
 const kp=$('#recKpis');if(kp)kp.innerHTML=recKpis(d);
}
async function copyText(t){
 try{await navigator.clipboard.writeText(t);toast('コピーしました')}
 catch(e){const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();toast(ok?'コピーしました':'コピーできませんでした。テキストを長押しして選択してください')}
}
function locked(){if(getDay().closed){toast('業務終了済みです。「記録を再開」で編集できます');return true}return false}

document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');
 if(!b){if(e.target.id==='sheet')closeSheet();return}
 const a=b.dataset.act,sh=ui.sheet,D=sh&&sh.data;
 if(a!=='wipe'&&a!=='delEntry')ui.confirm=null;
 switch(a){
  case 'tab':{const next=ui.tab==='set'&&b.dataset.tab==='set'?'rec':b.dataset.tab;ui.tab=next;render(true);window.scrollTo({top:0,behavior:reduced()?'auto':'smooth'});break}
  case 'crowd':{const d=editDay();d.crowd=d.crowd===b.dataset.v?'':b.dataset.v;save();buzz();if(ui.missing)ui.missing=ui.missing.filter(x=>x!=='crowd');if(sh)renderSheet();else render();break}
  case 'inc':if(locked())break;editDay().c[b.dataset.k]++;save();buzz();if(b.classList.contains('tap'))ripple(b,e);bumpCounter(b.dataset.k,'+1');break;
  case 'inc10':if(locked())break;editDay().c[b.dataset.k]+=10;save();buzz();bumpCounter(b.dataset.k,'+10');break;
  case 'dec':{if(locked())break;const d=editDay();if(d.c[b.dataset.k]===0)break;d.c[b.dataset.k]--;save();bumpCounter(b.dataset.k,'−1');break}
  case 'openSale':if(locked())break;openSale();break;
  case 'openLost':if(locked())break;openLost();break;
  case 'editSale':if(locked())break;openSale(b.dataset.id);break;
  case 'editLost':if(locked())break;openLost(b.dataset.id);break;
  case 'openEnd':openSheet({type:'end'});break;
  case 'finish':{const d=editDay(),m=endMissing(d);if(m.length){ui.missing=m;renderSheet();buzz(40);toast('未入力の必須項目があります');break}
   d.closed=nowHM();save();buzz(30);ui.sheet={type:'done'};renderSheet();render();break}
  case 'reopen':{const d=editDay();d.closed='';save();render(true);toast('記録を再開しました');break}
  case 'toReport':closeSheet();ui.tab='report';render(true);window.scrollTo(0,0);break;
  case 'close':closeSheet();break;
  case 'pickP':{const n=+b.dataset.n,i=D.items.findIndex(x=>x.p===n);if(i>=0)D.items[i].q++;else{D.items.push({p:n,v:'',q:1,out:false});sh.lastAdded=D.items.length-1}buzz();renderSheet();break}
  case 'outS':{const it=D.items[+b.dataset.i];it.os=it.os===b.dataset.v?'':b.dataset.v;renderSheet();break}
  case 'outC':{const it=D.items[+b.dataset.i];it.oc=it.oc===b.dataset.v?'':b.dataset.v;renderSheet();break}
  case 'qty':{const it=D.items[+b.dataset.i];it.q+=+b.dataset.d;if(it.q<=0)D.items.splice(+b.dataset.i,1);renderSheet();break}
  case 'sGender':D.gender=D.gender===b.dataset.v?'':b.dataset.v;renderSheet();break;
  case 'sAge':D.age=D.age===b.dataset.v?'':b.dataset.v;renderSheet();break;
  case 'flag':D[b.dataset.k]=!D[b.dataset.k];renderSheet();break;
  case 'rchip':D.reason=D.reason?D.reason+'、'+b.dataset.v:b.dataset.v;renderSheet();break;
  case 'saveSale':{const d=editDay(),rec={...D,id:sh.id||uid()};const outs=rec.items.filter(i=>i.out);rec.items=rec.items.map(({out,os,oc,...r})=>r);
   if(sh.id){d.sales[d.sales.findIndex(x=>x.id===sh.id)]=rec}else d.sales.push(rec);
   let done=0,skip=0;outs.forEach(i=>{const c=prodCfg(i.p);if((c.sizes.length&&!i.os)||(c.colors.length&&!i.oc)){skip++;return}S.stock[sk(i.p,i.os||'',i.oc||'')]='out';done++});
   save();buzz(20);closeSheet();ui.flash=rec.id;render();toast(skip?`保存しました。サイズ・色が未選択の${skip}件は欠品に反映していません`:done?'保存し、欠品に反映しました':'販売を保存しました');break}
  case 'lCat':D.cat=b.dataset.v;D.p='';D.v='';D.co='';D.sz='';renderSheet();break;
  case 'lReason':{const i=D.reasons.indexOf(b.dataset.v);i>=0?D.reasons.splice(i,1):D.reasons.push(b.dataset.v);renderSheet();break}
  case 'saveLost':{const d=editDay(),rec={...D,id:sh.id||uid()};if(sh.id){d.lost[d.lost.findIndex(x=>x.id===sh.id)]=rec}else d.lost.push(rec);save();closeSheet();ui.flash=rec.id;render();toast('保存しました');break}
  case 'delEntry':{if(ui.confirm!=='del'){ui.confirm='del';renderSheet();break}const d=editDay(),k=sh.type==='sale'?'sales':'lost';d[k]=d[k].filter(x=>x.id!==sh.id);save();closeSheet();render();toast('削除しました');break}
  case 'cell':{const k=b.dataset.k,cur=S.stock[k]||'ok',nx={ok:'low',low:'out',out:'ok'}[cur];if(nx==='ok')delete S.stock[k];else S.stock[k]=nx;save();buzz();
   const n=+k.split('|')[0],card=b.closest('.scard');card.outerHTML=stockCard(PMAP[n]);const nb=$(`.scard[data-card="${n}"] [data-k="${CSS.escape(k)}"]`);if(nb&&!reduced())nb.classList.add('pop');
   $('#stockSum').outerHTML=stockBanner();break}
  case 'cardReset':{const n=b.dataset.n;Object.keys(S.stock).forEach(k=>{if(k.split('|')[0]===n)delete S.stock[k]});save();buzz();$(`.scard[data-card="${n}"]`).outerHTML=stockCard(PMAP[n]);$('#stockSum').outerHTML=stockBanner();break}
  case 'stockDone':S.stockChecked=today();save();buzz(20);render();toast('チェック完了を記録しました');break;
  case 'resetTxt':{const d=editDay();delete d.txt[b.dataset.n];save();render();break}
  case 'copy':copyText(chromeText(ui.date));break;
  case 'startDay':{const f=ui.start;if(!(f&&f.reporter&&f.brand&&f.store))break;const d=editDay();Object.assign(d,{reporter:f.reporter.trim(),brand:f.brand,store:f.store,started:nowHM()});
   Object.assign(S.settings,{reporter:d.reporter,brand:d.brand,store:d.store});save();buzz(30);ui.start=null;render(true);toast('業務を開始しました');break}
  case 'theme':S.settings.theme=b.dataset.v;save();applyTheme();render();break;
  case 'period':ui.period=b.dataset.v;render(true);break;
  case 'goDay':ui.date=b.dataset.k;ui.tab='rec';render(true);window.scrollTo(0,0);break;
  case 'backup':copyText(JSON.stringify(S));break;
  case 'restore':{const v=$('#restoreTa').value.trim();try{const o=JSON.parse(v);if(!o||!o.days||!o.settings)throw 0;S=o;save();render(true);toast('バックアップから戻しました')}catch(_){toast('読み込めませんでした。コピーした内容をそのまま貼り付けてください')}break}
  case 'wipe':if(ui.confirm!=='wipe'){ui.confirm='wipe';render();break}S=blank();save();ui.confirm=null;ui.date=today();render(true);toast('すべての記録を消去しました');break;
  case 'clearSample':S=blank();save();ui.date=today();ui.tab='set';render(true);toast('サンプルを消しました。まず報告者名を入力してください');break;
 }
});
document.addEventListener('input',e=>{
 const el=e.target,bd=el.dataset.bind;if(!bd)return;
 const D=ui.sheet&&ui.sheet.data;
 switch(bd){
  case 'sd':D[el.dataset.k]=el.value;break;
  case 'txt':{const d=editDay();d.txt=d.txt||{};d.txt[el.dataset.n]=el.value;save();refreshOutputs();break}
  case 'wrap':case 'flyerLeft':{editDay()[bd]=el.value;save();refreshOutputs();el.closest('.field')?.classList.remove('missing');break}
  case 'set':S.settings[el.dataset.k]=el.value;save();break;
  case 'st':{ui.start[el.dataset.k]=el.value;const btn=$('[data-act=startDay]');if(btn){const f=ui.start;btn.disabled=!(f.reporter&&f.brand&&f.store)}break}
  case 'pprice':(S.settings.prod[el.dataset.n]=S.settings.prod[el.dataset.n]||{}).price=el.value;save();break;
  case 'plist':(S.settings.prod[el.dataset.n]=S.settings.prod[el.dataset.n]||{})[el.dataset.f]=el.value.split(/[,、，]/).map(x=>x.trim()).filter(Boolean);save();break;
 }
});
document.addEventListener('change',e=>{
 const el=e.target,bd=el.dataset.bind;if(!bd)return;
 const D=ui.sheet&&ui.sheet.data;
 if(bd==='itemOut'){D.items[+el.dataset.i].out=el.checked;renderSheet()}
 if(bd==='lp'){D.p=el.value?+el.value:'';D.v='';D.co='';D.sz='';renderSheet()}
 if(bd==='lvar'){D[el.dataset.k]=el.value;D.v=vlabel(D.co,D.sz)}
 if(bd==='sd'&&el.tagName==='SELECT'){D[el.dataset.k]=el.value}
 if(bd==='st'&&el.dataset.k==='brand'){ui.start.brand=el.value;ui.start.store='';render()}
 if(bd==='st'&&el.dataset.k==='store'){ui.start.store=el.value;render()}
 if(bd==='stDate'&&el.value){ui.date=el.value;ui.start=null;render(true)}
 if(bd==='setBrand'){S.settings.brand=el.value;if(!storesOf(el.value).includes(S.settings.store))S.settings.store='';save();render()}
 if(bd==='setStore'){S.settings.store=el.value;save()}
 if(bd==='pactive'){(S.settings.prod[el.dataset.n]=S.settings.prod[el.dataset.n]||{}).active=el.checked;save()}
 if((bd==='wrap'||bd==='flyerLeft')&&ui.tab==='report'&&!ui.sheet){const w=$('#main .banner.warn, #main .banner.info');if(w){const tmp=document.createElement('div');tmp.innerHTML=renderReport();w.replaceWith(tmp.firstElementChild)}}
});
$('#dateInput').addEventListener('change',e=>{if(e.target.value){ui.date=e.target.value;ui.start=null;render(true)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.sheet)closeSheet()});

render(true);
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>
</body>
</html>
